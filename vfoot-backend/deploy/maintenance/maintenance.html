<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>vfoot — torniamo presto</title>
<style>
  :root {
    --bg: #f6f7f5;
    --card: #ffffff;
    --ink: #1b2a20;
    --muted: #5d6d63;
    --accent: #1f7a4d;
    --line: #e2e7e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1512;
      --card: #161d19;
      --ink: #e8efea;
      --muted: #93a89b;
      --accent: #4ec98a;
      --line: #263029;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 32rem;
    width: 100%;
    text-align: center;
  }
  .mark {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--accent);
    margin: 0 0 4px;
  }
  .tag {
    display: inline-block;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 12px;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 1.35rem;
    margin: 0 0 12px;
    font-weight: 600;
  }
  p {
    margin: 0 0 12px;
    color: var(--muted);
  }
  p:last-child { margin-bottom: 0; }
  .rule {
    height: 1px;
    background: var(--line);
    margin: 28px 0 20px;
  }
  .small { font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <p class="mark">vfoot</p>
  <p class="tag">lavori in corso</p>
  <h1>Ci stiamo ancora lavorando</h1>
  <p>Il sito è in fase di sviluppo e non è ancora aperto al pubblico.</p>
  <p>Torna a trovarci tra qualche tempo: stiamo mettendo a posto le ultime cose.</p>
  <div class="rule"></div>
  <p class="small">Se stai già collaborando al progetto, sai come raggiungerci.</p>
</main>
</body>
</html>

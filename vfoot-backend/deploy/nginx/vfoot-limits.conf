# Rate limit — zone e chiave.  Va in /etc/nginx/conf.d/vfoot-limits.conf
#
# Sta in un file separato da vfoot.it.conf perche' `limit_req_zone` e `map`
# vivono nel contesto http, non dentro un `server`: messi li' nginx rifiuta di
# partire.  I file in conf.d/ sono inclusi dal blocco http di nginx.conf.
#
# Il perche' di ogni numero sta in docs/rate_limit_plan.md, misurato con
# `manage.py auction_load_test` il 17/08/2026.  In breve: il problema non e' che
# qualcuno indovini una password, e' che UNA richiesta anonima al login costa
# mezzo secondo di CPU su una macchina che di CPU ne ha una.

# --------------------------------------------------------------------------- #
# LA CHIAVE.  Questa riga e' la piu' importante del file.                       #
# --------------------------------------------------------------------------- #
# Contare per indirizzo IP e' giusto per chi non si e' ancora autenticato e
# SBAGLIATO per tutti gli altri: una lega che fa l'asta nella stessa stanza e'
# un IP solo con venti dispositivi dietro, e il socket dell'asta e' un
# campanello, non una consegna — a ogni rilancio OGNI dispositivo rilegge lo
# stato via REST.  Misurato: 20 dispositivi fanno 20 richieste per rilancio,
# 200 al secondo istantanee e 60 al secondo sostenute durante una guerra di
# rilanci.  Contate su una chiave sola, quelle richieste sono il triplo del
# limite e l'asta si chiuderebbe da sola dopo due secondi.
#
# Col token come chiave ogni utente ha il suo secchiello: due dispositivi della
# stessa persona (il token e' uno per utente, non per sessione) fanno 5 r/s
# contro un limite di 20.  Margine quattro volte.
#
# Il frontend manda sempre `Authorization: Token ...` (vfoot-frontend/src/api/
# backend.ts) e in produzione la base URL e' RELATIVA (/api/v1), quindi stessa
# origine e nessun preflight CORS: non esistono richieste dell'app che arrivino
# qui senza header.  Se un giorno la SPA venisse servita da un'altra origine,
# ogni OPTIONS di preflight ricadrebbe sulla chiave per IP e questo ragionamento
# andrebbe rifatto.
map $http_authorization $vfoot_key {
    ""      $binary_remote_addr;
    default $http_authorization;
}

# 10m tengono circa 160.000 chiavi.
#
# vfoot_api: largo di proposito.  Non e' qui che si difende la CPU — le letture
# di stato costano ~17ms l'una — ma serve un tetto perche' un client impazzito o
# un ciclo con un token valido non possa girare a vuoto per sempre.
limit_req_zone $vfoot_key zone=vfoot_api:10m rate=20r/s;

# vfoot_auth: gli endpoint che calcolano un hash.  Per IP, e non per scelta —
# qui un token per definizione non c'e' ancora.
#
# 20r/m sostenute = 0,33 richieste al secondo = ~17% della vCPU per chi insiste,
# contro il 100% di oggi.
limit_req_zone $binary_remote_addr zone=vfoot_auth:10m rate=20r/m;

# Il default sarebbe 503, che e' lo stesso stato della pagina di manutenzione:
# li si confonderebbe proprio mentre si cerca di capire cosa sta succedendo.
limit_req_status 429;

# NIENTE limit_conn, ed e' deliberato.  Contro la minaccia misurata non serve —
# il costo e' il RITMO delle richieste, non il numero di connessioni aperte — e
# con `http2 on` venti dispositivi sono venti connessioni, cioe' esattamente il
# valore che si sarebbe scelto a naso come limite.  E' il pezzo con piu'
# probabilita' di chiudere fuori i nostri e meno di fermare un attacco.

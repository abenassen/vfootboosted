server {
    listen 80;
    # Il DNS ha un record AAAA verso l IPv6 del Linode: senza questo listen
    # nginx ascolta solo su IPv4 e i client IPv6 (fra cui i validatori di
    # Let s Encrypt, che preferiscono IPv6) prendono "connection refused".
    # E' il motivo per cui il rinnovo del certificato non poteva funzionare.
    listen [::]:80;
    server_name vfoot.it www.vfoot.it;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vfoot.it www.vfoot.it;

    ssl_certificate     /etc/letsencrypt/live/vfoot.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vfoot.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32M;

    # --- MODALITA MANUTENZIONE (fase di testing) ---------------------------
    # La versione online e ancora uno scheletro instabile: tutto il sito
    # (SPA, /api, /admin, /ws, /static) risponde 503 con una pagina di
    # cortesia, cosi non e visitabile da nessuno.
    #
    # RIAPERTO l'11/08/2026: le tre righe set/if sono commentate qui sotto.
    # Per richiudere, togliere il # da quelle tre righe, poi
    #   nginx -t && systemctl reload nginx
    # Il resto del file resta invariato, quindi non serve altro.
    #
    # Il 503 e volutamente uno stato TEMPORANEO: i motori di ricerca non
    # indicizzano la pagina e non declassano il dominio.
    # Il path ACME resta fuori dal blocco, altrimenti il rinnovo del
    # certificato Let's Encrypt (autenticatore nginx) verrebbe rifiutato.
    #set $manutenzione 1;
    #if ($request_uri ~ ^/\.well-known/acme-challenge/) { set $manutenzione 0; }
    #if ($manutenzione) { return 503; }

    # Senza questa location il path ACME, esente dal 503, ricadrebbe sulla
    # SPA e servirebbe index.html a chiunque lo indovinasse. Qui serve solo
    # i file di challenge veri (certbot con autenticatore nginx aggiunge da
    # se una location "= /.well-known/acme-challenge/<token>", che ha
    # priorita su questa).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    error_page 503 @manutenzione;
    location @manutenzione {
        root /srv/vfoot-maintenance;   # fuori da /srv/vfoot-web: il deploy
        rewrite ^ /maintenance.html break;   # fa rsync --delete e la cancellerebbe
        add_header Retry-After 86400 always;
        add_header Cache-Control "no-store" always;
    }
    # --- FINE MANUTENZIONE -------------------------------------------------

    # SPA React: build statica servita direttamente da nginx.
    root /srv/vfoot-web;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }   # rotte lato client

    # File statici dell admin Django
    # IL BENCHMARK DEL VOTO — 40 pagine statiche (indice, 38 giornate, divergenze) con
    # i nostri voti accanto ai due di fantacalcio.it e al rating SofaScore. Non e'
    # collegato da nessuna parte nell'app: si da' per link diretto a chi chiede conto
    # di un voto o fa da collaudo. noindex/nofollow e autoindex off.
    #
    # Tre cose che sembrano dettagli e non lo sono:
    #  * `^~` batte il fallback della SPA (`location /`), che altrimenti risponderebbe
    #    index.html per ogni file;
    #  * la cartella sta FUORI da /srv/vfoot-web, come la pagina di manutenzione: il
    #    passo 5 del deploy fa `rsync --delete` su quella e cancellerebbe tutto;
    #  * NGINX NON BASTA. Il service worker della PWA risponde a OGNI navigazione con
    #    il guscio dell'app tranne i percorsi nella sua lista di esclusione, e il
    #    12/08/2026 questo link ha dato il 404 DELL'APP a chi lo apriva. Non serve
    #    avere la PWA installata per finirci: il worker si registra alla prima visita
    #    normale. L'eccezione e' in vfoot-frontend/src/sw.ts (denylist): se questo
    #    indirizzo cambia, va cambiato anche la'.
    location ^~ /benchmark-voto/ {
        alias /srv/vfoot-benchmark/;
        index index.html;
        autoindex off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
        expires 1h;
    }

    location /static/ { alias /srv/vfoot-app/vfoot-backend/src/staticfiles/; access_log off; expires 7d; }

    # API e admin -> uvicorn (ASGI)
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # senza questo Django crede che la richiesta sia in chiaro e i cookie
        # sicuri non vengono mai accettati
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket: previsto ORA per l asta live (banditore/rilanci), cosi non
    # dovremo rimettere mano a nginx quando la implementeremo.
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # le connessioni d asta restano aperte a lungo
    }

    # --- PWA ---------------------------------------------------------------
    # Il service worker NON va messo in cache. La regola generica qui sotto lo
    # prenderebbe (finisce in .js) e gli darebbe 30 giorni: il match esatto "="
    # ha priorita su ogni regex, quindi vince questo. I browser moderni
    # scavalcano comunque la cache HTTP per lo script principale del worker, ma
    # non i proxy intermedi — e un worker vecchio bloccato in cache serve la
    # build precedente a chi ha l'app aperta, che e' proprio il modo in cui un
    # aggiornamento non arriva mai.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }
    # mime.types di nginx non conosce .webmanifest: senza questo esce come
    # application/octet-stream. Chrome e' tollerante, Firefox segnala.
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        expires -1;
    }
    # --- fine PWA ----------------------------------------------------------

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ { expires 30d; access_log off; }
}

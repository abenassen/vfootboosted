# Compressione delle risposte.  Va in /etc/nginx/conf.d/vfoot-gzip.conf
#
# Sta in un file separato da vfoot.it.conf per lo stesso motivo di
# vfoot-limits.conf: le direttive `gzip_*` vivono nel contesto http, non dentro
# un `server`.  I file in conf.d/ sono inclusi dal blocco http di nginx.conf
# (riga 60), cioe' DOPO il suo blocco "Gzip Settings" (riga 47): quello che si
# dichiara qui vince, e il file della distribuzione resta intonso.
#
# --------------------------------------------------------------------------- #
# PERCHE' ESISTE.  nginx.conf ha `gzip on` ma `gzip_types` commentato, che e'  #
# il default Debian.  Senza `gzip_types` nginx comprime UN SOLO tipo:          #
# text/html.  Quindi oggi (misurato su https://vfoot.it il 19/08/2026):        #
#                                                                              #
#   index.html                 -> gzip                                         #
#   /assets/index-*.js  830 KB -> NIENTE, content-length: 830493               #
#   /api/v1/...  (JSON)        -> NIENTE                                       #
#                                                                              #
# E' il file piu' pesante del sito e il payload che si moltiplica di piu' a     #
# viaggiare in chiaro.                                                         #
# --------------------------------------------------------------------------- #
#
# QUANTO SI GUADAGNA, sui payload veri e a livello 1:
#
#   bundle JS      814 KB -> 283 KB  (-65%)   ogni primo accesso e ogni deploy
#   stato asta    20,4 KB ->  3,0 KB  (-85%)   ogni dispositivo, OGNI rilancio
#   rose piene    16,4 KB ->  2,2 KB  (-86%)   a ogni aggiudicazione
#   pool listone  61,1 KB -> 11,6 KB  (-81%)   il banditore, a ogni evento
#
# Il JSON comprime cosi' bene perche' e' quasi tutto nomi di chiave ripetuti
# duecento volte.  In un'asta da 12 partecipanti un solo rilancio passa da
# 245 KB a 36 KB di traffico complessivo.

# QUI NON CI VA `gzip on`.  E' gia' dichiarato in nginx.conf (riga 47) e nello
# stesso contesto http una seconda volta e' un errore FATALE, non un doppione
# innocuo: nginx rifiuta di partire con
#
#   [emerg] "gzip" directive is duplicate in .../vfoot-gzip.conf
#
# Verificato il 19/08/2026 con `nginx -t` su un albero di prova.  Se un giorno
# `gzip on` sparisse da nginx.conf, questo file va acceso rimettendocelo — ma
# allora va tolto di la', non aggiunto qui.

# LIVELLO 1, non 6.  Su questa macchina la CPU e' una sola ed e' la risorsa
# scarsa (docs/rate_limit_plan.md).  Misurato sui payload di cui sopra:
#
#            livello 1        livello 6
#   stato    3,0 KB  0,10 ms  2,6 KB  0,21 ms
#   pool    11,6 KB  0,34 ms 10,2 KB  1,08 ms
#   bundle   283 KB  11,6 ms  238 KB  31,2 ms
#
# Il livello 1 prende gia' il 96% del beneficio a un terzo del costo, e 0,10 ms
# accanto ai ~15 ms che Django impiega a produrre lo stato dell'asta e' sotto
# l'1%.  Alzarlo si paga a ogni risposta e si incassa una volta sola.
gzip_comp_level 1;

# Sotto il chilobyte non conviene: l'intestazione gzip da sola sono una ventina
# di byte, e su una risposta di 200 byte il compresso puo' venire piu' grande
# dell'originale.  Il default di nginx (20 byte) comprime anche i {"detail":...}.
gzip_min_length 1024;

# Le API stanno dietro `proxy_pass` verso Django, e per le risposte che arrivano
# da un upstream il default (`off`) sarebbe di non comprimerle quando la
# richiesta porta un header Via.  Nessun browser lo manda, ma dirlo esplicito
# costa nulla e toglie di mezzo la dipendenza da un default.
gzip_proxied any;

# Con la compressione la stessa URL puo' rispondere in due modi a seconda che il
# client la chieda compressa o no: senza `Vary: Accept-Encoding` un proxy (o il
# service worker) puo' servire il compresso a chi non lo capisce.
gzip_vary on;

# text/html NON va elencato: nginx lo comprime sempre, e ripeterlo qui e' un
# errore di configurazione ("duplicate MIME type").
#
# Fuori restano i formati gia' compressi in se' — png, jpg, woff2 — dove gzip
# spende CPU per guadagnare zero o per far crescere il file.  Il nome dei tipi
# e' quello che nginx assegna davvero secondo /etc/nginx/mime.types: li' `.js`
# e' `application/javascript` (verificato, non text/javascript), e sbagliare il
# nome vuol dire lasciare il bundle in chiaro senza nessun errore visibile.
gzip_types
    application/javascript
    text/javascript
    application/json
    application/manifest+json
    application/xml
    text/css
    text/plain
    text/xml
    image/svg+xml;

# Se accanto a `pippo.js` c'e' un `pippo.js.gz`, servi quello e non comprimere
# niente a runtime.  Il modulo c'e' (nginx -V | --with-http_gzip_static_module).
#
# Oggi i .gz non ci sono e la direttiva e' inerte: e' il gancio per il passo di
# deploy che li produce (DEPLOY.md), dove il bundle si comprime UNA volta a
# livello 9 invece che a ogni richiesta.  Acceso da subito perche' il giorno in
# cui quei file compaiono non serva ricordarsi anche di questa riga.
gzip_static on;

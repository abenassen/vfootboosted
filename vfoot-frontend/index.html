<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vfoot Boosted</title>
    <!-- Colours the phone's status bar when the app runs installed. -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Fantacalcio sui dati reali: voti, aste, mercato e decisioni di lega." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- iOS ignores the manifest icons for the Home Screen and uses this one; without
         it Safari puts a screenshot of the page under the user's finger. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vfoot" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
